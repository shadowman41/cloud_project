<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes commandes - E-Market</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="top-bar">
        <div class="container">🎉 Bienvenue sur E-Market ! Livraison gratuite dès 15 000 FCFA</div>
    </div>
    <header>
        <div class="container">
            <div class="main-nav">
                <a href="index.html" class="logo">
                    <img src="images/logo.jpeg" alt="E-Market" onerror="this.parentElement.innerHTML='<span style=\'font-size:24px;font-weight:800;color:var(--primary-color);\'>🛒 E-MARKET</span>'">
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Accueil</a></li>
                    <li><a href="e-market_homepage.html">Boutique</a></li>
                    <li><a href="services.html">Services</a></li>
                </ul>
                <div class="search-container" style="max-width:260px;">
                    <input type="text" id="searchInput" placeholder="Rechercher...">
                    <button type="button" id="searchBtn">🔍</button>
                </div>
                <div class="nav-actions" id="navActions"></div>
            </div>
        </div>
    </header>

    <main class="container" style="margin-top:30px;">
        <div class="breadcrumb">
            <a href="index.html">Accueil</a><span class="sep">›</span>
            <a href="profil.html">Mon compte</a><span class="sep">›</span> Mes commandes
        </div>

        <div class="div1">
            <h1>📦 Mes commandes</h1>
        </div>

        <div id="ordersContainer">
            <div class="loading-wrap"><div class="loader loader-lg"></div><p style="margin-top:10px;color:#666;">Chargement des commandes…</p></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="copyright">&copy; 2026 E-Market. Tous droits réservés. Fait avec ❤️ au Sénégal 🇸🇳</div>
        </div>
    </footer>

    <div class="modal-overlay" id="orderDetailModal">
        <div class="modal" style="max-width:720px;">
            <div class="modal-header">
                <h3>Détail de la commande</h3>
                <button class="modal-close" onclick="document.getElementById('orderDetailModal').classList.remove('show')">×</button>
            </div>
            <div class="modal-body" id="orderDetailBody"></div>
        </div>
    </div>

    <script src="assets/app.js"></script>
    <script>
        const STATUTS_FR = {
            en_attente: { lib: 'En attente', cls: 'badge-en_attente' },
            validee:   { lib: 'Validée',   cls: 'badge-validee' },
            expediee:  { lib: 'Expédiée',  cls: 'badge-expediee' },
            livree:    { lib: 'Livrée',    cls: 'badge-livree' },
            annulee:   { lib: 'Annulée',   cls: 'badge-annulee' }
        };
        const PAIEMENT_FR = {
            en_attente: { lib: 'En attente', cls: 'badge-en_attente' },
            paye:       { lib: 'Payé',       cls: 'badge-validee' },
            echoue:     { lib: 'Échoué',     cls: 'badge-annulee' },
            rembourse:  { lib: 'Remboursé',  cls: 'badge-expediee' }
        };
        const METHODES_FR = {
            orange_money: '🧡 Orange Money',
            wave: '💙 Wave',
            carte: '💳 Carte bancaire',
            paiement_livraison: '💵 À la livraison'
        };

        async function loadOrders() {
            const cont = document.getElementById('ordersContainer');
            try {
                if (!EMarket.user) {
                    cont.innerHTML = `<div class="alert alert-info">🔒 <a href="connexion.html" style="color:var(--primary-color);font-weight:600;">Connectez-vous</a> pour voir vos commandes.</div>`;
                    return;
                }
                const orders = await EMarket.request('/commandes');
                const refFocus = EMarket.qs('ref');
                if (!orders?.length) {
                    cont.innerHTML = `<div class="empty-state"><div class="icon">📦</div><h3>Vous n'avez pas encore de commande</h3>
                    <p>Parcourez notre boutique et passez votre première commande !</p><br>
                    <a href="e-market_homepage.html" class="btn btn-lg">Découvrir la boutique</a></div>`;
                    return;
                }

                cont.innerHTML = `<div class="orders-list">${orders.map(o => {
                    const st = STATUTS_FR[o.statut] || STATUTS_FR.en_attente;
                    const preview = (o.articles || []).slice(0,4).map(a => {
                        const img = a.image_principale ? `images/${a.image_principale.split('/').pop()}` : 'images/Electro.webp';
                        return `<img src="${img}" onerror="this.src='images/Electro.webp'">`;
                    }).join('');
                    return `
                        <div class="order-item">
                            <div class="order-info">
                                <h4>${o.numero_commande}</h4>
                                <div class="date">${new Date(o.date_commande).toLocaleString('fr-FR')}</div>
                                <div class="items-preview">${preview}</div>
                                <div style="margin-top:8px;font-size:13px;color:#666;">${(o.articles||[]).length} article(s) · ${METHODES_FR[o.methode_paiement] || o.methode_paiement}</div>
                            </div>
                            <div class="order-status">
                                <div><span class="badge-status ${st.cls}">${st.lib}</span></div>
                                <div style="font-size:12px;color:#888;margin-top:4px;">Paiement: ${PAIEMENT_FR[o.paiement_statut]?.lib || o.paiement_statut}</div>
                                <div class="total">${EMarket.fmtFCFA(o.montant_total)}</div>
                                <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:flex-end;">
                                    <button class="btn btn-secondary btn-detail" data-id="${o.id}">Détails</button>
                                    ${o.statut === 'en_attente' && o.methode_paiement !== 'paiement_livraison'
                                        ? `<button class="btn btn-pay" data-id="${o.id}">💸 Payer</button>` : ''}
                                    ${['en_attente','validee'].includes(o.statut)
                                        ? `<button class="btn btn-danger btn-cancel" data-id="${o.id}" style="background:#c0392b;">Annuler</button>` : ''}
                                </div>
                            </div>
                        </div>`;
                }).join('')}</div>`;

                cont.querySelectorAll('.btn-detail').forEach(b => b.addEventListener('click', () => showOrderDetail(parseInt(b.dataset.id))));
                cont.querySelectorAll('.btn-cancel').forEach(b => b.addEventListener('click', async () => {
                    if (!confirm('Êtes-vous sûr d\'annuler cette commande ?')) return;
                    try {
                        await EMarket.request(`/commandes/${b.dataset.id}/annuler`, { method: 'POST' });
                        EMarket.toast('Commande annulée', 'success');
                        loadOrders();
                    } catch (e) { EMarket.toast(e.message, 'error'); }
                }));
                cont.querySelectorAll('.btn-pay').forEach(b => b.addEventListener('click', async () => {
                    try {
                        await EMarket.request(`/commandes/${b.dataset.id}/confirmer`, { method: 'POST' });
                        EMarket.toast('Paiement confirmé', 'success');
                        loadOrders();
                    } catch (e) { EMarket.toast(e.message, 'error'); }
                }));

                if (refFocus) {
                    const firstBtn = cont.querySelector(`.btn-detail`);
                    if (firstBtn) setTimeout(() => firstBtn.click(), 300);
                }
            } catch (err) {
                cont.innerHTML = `<div class="alert alert-error">❌ ${err.message}</div>`;
            }
        }

        async function showOrderDetail(id) {
            const body = document.getElementById('orderDetailBody');
            body.innerHTML = `<div class="loading-wrap"><div class="loader"></div></div>`;
            document.getElementById('orderDetailModal').classList.add('show');
            try {
                const o = await EMarket.request(`/commandes/${id}`);
                const st = STATUTS_FR[o.statut];
                const pSt = PAIEMENT_FR[o.paiement_statut];
                body.innerHTML = `
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
                        <div>
                            <h3 style="color:var(--primary-color);margin-bottom:4px;">${o.numero_commande}</h3>
                            <div style="color:#888;font-size:13px;">Passée le ${new Date(o.date_commande).toLocaleString('fr-FR')}</div>
                        </div>
                        <span class="badge-status ${st.cls}" style="font-size:13px;">${st.lib}</span>
                    </div>
                    <div class="row" style="margin-bottom:16px;">
                        <div class="col-6">
                            <strong>Livraison</strong><br>
                            <span style="color:#555;font-size:13px;">${o.adresse_livraison}</span><br>
                            <span style="color:#555;font-size:13px;">📞 ${o.telephone_livraison || '-'}</span>
                        </div>
                        <div class="col-6">
                            <strong>Paiement</strong><br>
                            <span style="color:#555;font-size:13px;">${METHODES_FR[o.methode_paiement] || o.methode_paiement}</span><br>
                            <span class="badge-status ${pSt.cls}" style="font-size:11px;padding:2px 8px;">${pSt.lib}</span>
                        </div>
                    </div>
                    <h4 style="color:var(--primary-color);margin-bottom:10px;">${o.articles.length} article(s)</h4>
                    <div style="border:1px solid #eee;border-radius:8px;overflow:hidden;">
                        ${o.articles.map(a => {
                            const img = a.image_principale ? `images/${a.image_principale.split('/').pop()}` : 'images/Electro.webp';
                            return `
                            <div style="display:flex;padding:12px;border-bottom:1px solid #eee;gap:12px;align-items:center;">
                                <img src="${img}" style="width:50px;height:50px;border-radius:6px;object-fit:cover;" onerror="this.src='images/Electro.webp'">
                                <div style="flex:1;font-size:13px;">
                                    <div style="font-weight:500;">${a.nom_produit}</div>
                                    <div style="color:#777;">Qté: ${a.quantite} × ${EMarket.fmtFCFA(a.prix_unitaire)}</div>
                                </div>
                                <div style="font-weight:600;color:var(--primary-color);">${EMarket.fmtFCFA(a.sous_total)}</div>
                            </div>`;
                        }).join('')}
                    </div>
                    <div style="padding:16px 4px;">
                        <div class="summary-line"><span>Sous-total</span><span>${EMarket.fmtFCFA(o.montant_ht)}</span></div>
                        <div class="summary-line"><span>TVA (18%)</span><span>${EMarket.fmtFCFA(o.tva)}</span></div>
                        <div class="summary-line"><span>Frais de livraison</span><span>${EMarket.fmtFCFA(o.frais_livraison)}</span></div>
                        <div class="summary-line total"><span>TOTAL</span><span>${EMarket.fmtFCFA(o.montant_total)}</span></div>
                    </div>
                    ${o.notes_client ? `<div style="padding:10px;background:#f8f8f8;border-radius:6px;font-size:13px;"><strong>Note:</strong> ${o.notes_client}</div>` : ''}
                `;
            } catch (e) {
                body.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
            }
        }

        loadOrders();
    </script>
</body>
</html>
