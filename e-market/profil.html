<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon profil - E-Market</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="top-bar"><div class="container">🎉 Bienvenue sur E-Market ! Livraison gratuite dès 15 000 FCFA</div></div>
    <header>
        <div class="container">
            <div class="main-nav">
                <a href="index.html" class="logo"><img src="images/logo.jpeg" alt="E-Market" onerror="this.parentElement.innerHTML='<span style=\'font-size:24px;font-weight:800;color:var(--primary-color);\'>🛒 E-MARKET</span>'"></a>
                <ul class="nav-links"><li><a href="index.html">Accueil</a></li><li><a href="e-market_homepage.html">Boutique</a></li><li><a href="services.html">Services</a></li></ul>
                <div class="search-container" style="max-width:260px;"><input type="text" id="searchInput" placeholder="Rechercher..."><button type="button" id="searchBtn">🔍</button></div>
                <div class="nav-actions" id="navActions"></div>
            </div>
        </div>
    </header>
    <main class="container" style="margin-top:30px;">
        <div class="breadcrumb"><a href="index.html">Accueil</a><span class="sep">›</span> Mon profil</div>
        <div id="profilContainer">
            <div class="loading-wrap"><div class="loader loader-lg"></div></div>
        </div>
    </main>
    <footer><div class="container"><div class="copyright">&copy; 2026 E-Market. Tous droits réservés. Fait avec ❤️ au Sénégal 🇸🇳</div></div></footer>
    <script src="assets/app.js"></script>
    <script>
        async function loadProfil() {
            const cont = document.getElementById('profilContainer');
            if (!EMarket.user) {
                cont.innerHTML = `<div class="alert alert-info">🔒 <a href="connexion.html" style="color:var(--primary-color);font-weight:600;">Connectez-vous</a> pour accéder à votre profil.</div>`;
                return;
            }
            try {
                const u = await EMarket.request('/auth/me');
                const initial = (u.prenom?.[0] || u.nom?.[0] || 'U').toUpperCase();
                cont.innerHTML = `
                    <div class="div1"><h1>👤 Mon profil</h1></div>
                    <div class="row" style="gap:24px;">
                        <div class="col-4" style="flex-basis:260px;flex-grow:0;">
                            <div style="background:white;padding:24px;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);text-align:center;">
                                <div style="width:100px;height:100px;margin:0 auto 14px;border-radius:50%;background:var(--primary-color);color:white;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;">${initial}</div>
                                <h3 style="color:var(--primary-color);margin-bottom:4px;">${[u.prenom, u.nom].filter(Boolean).join(' ') || u.email}</h3>
                                <div style="color:#888;font-size:13px;margin-bottom:14px;">${u.role === 'admin' ? '🎛️ Administrateur' : '🛍️ Client'} depuis ${new Date(u.date_creation).toLocaleDateString('fr-FR')}</div>
                                <div style="display:grid;gap:8px;">
                                    <a href="commandes.html" class="btn btn-secondary">📦 Mes commandes</a>
                                    <a href="favoris.html" class="btn btn-secondary">❤️ Mes favoris</a>
                                    <a href="panier.html" class="btn btn-secondary">🛒 Mon panier</a>
                                    <a href="#" id="logoutBtn2" class="btn btn-danger" style="background:#c0392b;">🚪 Déconnexion</a>
                                </div>
                            </div>
                        </div>
                        <div class="col-6" style="flex:1;">
                            <form id="profilForm" style="background:white;padding:24px;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);">
                                <div id="alertBox"></div>
                                <h3 style="color:var(--primary-color);margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #eee;">✏️ Modifier mes informations</h3>
                                <div class="form-row">
                                    <div class="form-group"><label>Prénom</label><input type="text" id="prenom" value="${u.prenom || ''}"></div>
                                    <div class="form-group"><label>Nom</label><input type="text" id="nom" value="${u.nom || ''}"></div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group"><label>Email</label><input type="email" value="${u.email}" disabled style="background:#f5f5f5;"></div>
                                    <div class="form-group"><label>Téléphone</label><input type="tel" id="telephone" value="${u.telephone || ''}"></div>
                                </div>
                                <div class="form-group"><label>Adresse</label><input type="text" id="adresse" value="${u.adresse || ''}" placeholder="Numéro, rue, résidence..."></div>
                                <div class="form-row">
                                    <div class="form-group"><label>Ville</label><input type="text" id="ville" value="${u.ville || ''}"></div>
                                    <div class="form-group"><label>Pays</label><input type="text" id="pays" value="${u.pays || 'Sénégal'}"></div>
                                </div>
                                <button type="submit" class="btn btn-lg btn-block">💾 Enregistrer les modifications</button>
                            </form>
                            <form id="mdpForm" style="background:white;padding:24px;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);margin-top:20px;">
                                <div id="alertBoxMdp"></div>
                                <h3 style="color:var(--primary-color);margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid #eee;">🔐 Changer mon mot de passe</h3>
                                <div class="form-group"><label>Ancien mot de passe</label><input type="password" id="ancien_mdp" required></div>
                                <div class="form-row">
                                    <div class="form-group"><label>Nouveau mot de passe</label><input type="password" id="nouveau_mdp" required minlength="6"></div>
                                    <div class="form-group"><label>Confirmer</label><input type="password" id="nouveau_mdp2" required minlength="6"></div>
                                </div>
                                <button type="submit" class="btn btn-block">🔑 Modifier le mot de passe</button>
                            </form>
                        </div>
                    </div>`;
                document.getElementById('logoutBtn2')?.addEventListener('click', e => { e.preventDefault(); EMarket.logout(); window.location.href='index.html'; });
                document.getElementById('profilForm').addEventListener('submit', async e => {
                    e.preventDefault();
                    try {
                        await EMarket.request('/auth/profil', { method:'PUT', body:{
                            prenom: document.getElementById('prenom').value.trim(),
                            nom: document.getElementById('nom').value.trim(),
                            telephone: document.getElementById('telephone').value.trim(),
                            adresse: document.getElementById('adresse').value.trim(),
                            ville: document.getElementById('ville').value.trim(),
                            pays: document.getElementById('pays').value.trim()
                        }});
                        const user = { ...EMarket.user,
                            prenom: document.getElementById('prenom').value.trim(),
                            nom: document.getElementById('nom').value.trim(),
                            telephone: document.getElementById('telephone').value.trim()
                        };
                        EMarket.setUser(user, EMarket.token);
                        document.getElementById('alertBox').innerHTML = `<div class="alert alert-success">✅ Profil mis à jour avec succès</div>`;
                    } catch(err) { document.getElementById('alertBox').innerHTML = `<div class="alert alert-error">❌ ${err.message}</div>`; }
                });
                document.getElementById('mdpForm').addEventListener('submit', async e => {
                    e.preventDefault();
                    const a = document.getElementById('alertBoxMdp');
                    const n1 = document.getElementById('nouveau_mdp').value;
                    const n2 = document.getElementById('nouveau_mdp2').value;
                    if (n1 !== n2) { a.innerHTML = `<div class="alert alert-error">❌ Les nouveaux mots de passe ne correspondent pas</div>`; return; }
                    try {
                        await EMarket.request('/auth/change-password', { method:'PUT', body:{
                            ancien_mdp: document.getElementById('ancien_mdp').value,
                            nouveau_mdp: n1
                        }});
                        a.innerHTML = `<div class="alert alert-success">✅ Mot de passe modifié</div>`;
                        document.getElementById('mdpForm').reset();
                    } catch(err) { a.innerHTML = `<div class="alert alert-error">❌ ${err.message}</div>`; }
                });
            } catch (err) {
                cont.innerHTML = `<div class="alert alert-error">❌ ${err.message}</div>`;
            }
        }
        loadProfil();
    </script>
</body>
</html>
